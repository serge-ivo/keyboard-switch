name: Test, Publish, and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') && secrets.NPM_TOKEN != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Run tests
        run: make test

      - name: Prepare release package metadata
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME }}
          NPM_PACKAGE_SCOPE_USER: ${{ vars.NPM_PACKAGE_SCOPE_USER }}
        run: npm run prepare:publish:release

      - name: Publish stable package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Build app bundle
        run: make app

      - name: Build installer package
        run: make pkg

      - name: Zip app bundle
        run: zip -r KeyboardMonitor.zip KeyboardMonitor.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KeyboardMonitor.zip
            dist/*.pkg
